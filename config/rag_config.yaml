pipeline:
  name: merchant-rag-pipeline
  version: "1.0.0"

chunking:
  chunk_size: 1000
  chunk_overlap: 200
  strategy: recursive       # recursive | sentence | token

retrieval:
  k: 5
  search_type: hybrid       # vector | keyword | hybrid
  score_threshold: 0.0

generation:
  temperature: 0.0
  max_tokens: 1024

evaluation:
  faithfulness_threshold: 0.85
  relevancy_threshold: 0.82
  precision_threshold: 0.78
  recall_threshold: 0.80

databricks:
  catalog: catalog
  schema_bronze: bronze
  schema_silver: silver
  schema_gold: gold
  vector_endpoint: rag-prod-endpoint
